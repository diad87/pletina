  <body>
    <main id="home-screen">
      <img src="./icons/icon-192.png" width="56" height="56" alt="" />
      <p class="name">Pletina</p>
      <h1 id="headline" data-installed-title="Hola mundo.">Instalar Pletina</h1>
      <p id="intro">Llévala a tu pantalla de inicio.</p>
      <div class="actions">

        <button id="apply-update" type="button" hidden>Actualizar y abrir</button>

      <button id="open-player" type="button">Abrir Pletina</button>

        <button id="check-update" type="button" hidden>Buscar actualizaciones</button>
      </details>
      <noscript><p>Activa JavaScript para guardar la app y recibir actualizaciones.</p></noscript>
      <footer>Versión <span id="version">1ea46db9dc0b5af3</span></footer>
    </main>
    <section id="player-screen" aria-label="Reproductor" hidden>
      <button id="back-home" type="button">Volver al inicio</button>
      <div id="player-host"></div>
    </section>
    <dialog id="install-guide" aria-labelledby="guide-title">
      <header class="guide-heading">
        <h2 id="guide-title">Instalar Pletina</h2>
        <button id="close-guide" type="button" aria-label="Cerrar instrucciones" title="Cerrar" autofocus>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </header>
      <p id="guide-context">En tu navegador, toca estos botones.</p>
      <p id="guide-lead" hidden></p>
      <ol id="guide-steps" role="list"></ol>
      <figure class="guide-ready">
        <img src="./icons/icon-192.png" width="64" height="64" alt="Icono de Pletina" />
        <figcaption>Después, abre este icono<strong>Pletina</strong></figcaption>
      </figure>
    </dialog>
