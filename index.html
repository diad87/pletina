<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14111b"><meta name="referrer" content="no-referrer">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png">
<title>Pletina</title><style>html{color-scheme:dark;background:#14111b;color:#f3edf9;font:17px system-ui}body{max-width:32rem;margin:18vh auto;padding:24px}button,a{color:inherit}button{padding:12px 20px;font:inherit}</style></head>
<body><h1>Pletina</h1><p id="status" role="status">Preparando Pletina…</p><button id="retry" hidden>Reintentar</button>
<script>
const statusText = document.querySelector('#status'), retry = document.querySelector('#retry')
async function openPletina() {
  retry.hidden = true
  statusText.textContent = 'Preparando Pletina…'
  try {
    if (!('serviceWorker' in navigator)) throw new Error('Navegador sin soporte.')
    const root = new URL('./', location.href)
    const registration = await navigator.serviceWorker.register(new URL('sw.js', root), {scope: root.href, updateViaCache: 'none'})
    await Promise.race([navigator.serviceWorker.ready, new Promise((_, reject) => setTimeout(() => reject(new Error('Sin conexión.')), 30000))])
    if (!navigator.serviceWorker.controller) await new Promise(resolve => navigator.serviceWorker.addEventListener('controllerchange', resolve, {once:true}))
    // Only this network bootstrap reloads; the cached application replaces it.
    location.replace(new URL('?open=app', root).href)
  } catch {
    statusText.textContent = 'No se pudo preparar Pletina. Comprueba la conexión y reintenta. Tus datos guardados se conservan.'
    retry.hidden = false
  }
}
retry.addEventListener('click', openPletina)
void openPletina()
</script></body></html>
