name: PWA end-to-end browsers

on:
  workflow_dispatch:
  pull_request:
    paths: ['pwa/**', 'web-port/**', 'src/**', 'scripts/**', 'package*.json', 'vite.pwa.config.ts', '.github/workflows/pwa-e2e.yml']

permissions:
  contents: read

jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run check
      - run: npm test
      - run: npm run build:pwa
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-e2e-evidence
          path: artifacts/pwa-e2e/
          retention-days: 14
