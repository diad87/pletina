# Compila, firma y publica los instaladores de Windows, Mac y Linux.
# Se lanza al subir una etiqueta de versión (v1.2.3) o a mano desde la pestaña Actions
# (a mano solo compila; publicar requiere una etiqueta).
name: Compilar instaladores

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            args: ''
          - os: macos-latest
            # "app" genera el paquete que usa el actualizador; "dmg", el instalador.
            bundles: app,dmg
            # Un solo instalador para Mac con chip de Apple y con Intel.
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            bundles: appimage,deb
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - run: npm ci

      - name: Compilar y firmar
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} ${{ matrix.args }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: musify-${{ runner.os }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/nsis/*.exe.sig
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: error

  # Publica en el repositorio público (de ahí se descargan las actualizaciones).
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Notas de la versión (mensaje de la etiqueta)
        run: git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > notes.md

      - name: Preparar instaladores y latest.json
        run: node scripts/release.mjs artifacts "$GITHUB_REF_NAME" notes.md

      - name: Publicar en musify-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Falta el secreto RELEASES_TOKEN: la versión está compilada (artefactos de esta ejecución) pero no se ha publicado."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/_release/* \
            --repo diad87/musify-releases \
            --title "Musify ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
