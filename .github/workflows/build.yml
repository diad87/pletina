# Compila, firma y publica los instaladores de Windows, Mac y Linux, y el APK de Android.
# Se lanza al subir una etiqueta de versión (v1.2.3) o a mano desde la pestaña Actions
# (a mano solo compila; publicar requiere una etiqueta).
name: Compilar instaladores

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            args: ''
          - os: macos-latest
            # "app" genera el paquete que usa el actualizador; "dmg", el instalador.
            bundles: app,dmg
            # Un solo instalador para Mac con chip de Apple y con Intel.
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            bundles: appimage,deb
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - run: npm ci

      - name: Compilar y firmar
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} ${{ matrix.args }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: pletina-${{ runner.os }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/nsis/*.exe.sig
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: error

  # APK de Android (ver docs/plan-mobile.md): solo ARM de 64 bits, firmado con la clave de
  # ~/.musify/android.jks (secretos ANDROID_KEYSTORE, en base64, y ANDROID_KEYSTORE_PASSWORD).
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - name: NDK (la misma versión que en el PC)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Clave de firma
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE: sin él, el APK no se puede firmar."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/android.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/android.jks" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Compilar y firmar
        run: npm run tauri android build -- --apk --target aarch64
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: pletina-Android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if-no-files-found: error

  # Publica en el repositorio público (de ahí se descargan las actualizaciones). Si falla solo el
  # APK, se publica igual lo de escritorio.
  publish:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Notas de la versión (mensaje de la etiqueta)
        run: git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)' > notes.md

      - name: Preparar instaladores y latest.json
        run: node scripts/release.mjs artifacts "$GITHUB_REF_NAME" notes.md

      - name: Publicar en pletina-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Falta el secreto RELEASES_TOKEN: la versión está compilada (artefactos de esta ejecución) pero no se ha publicado."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/_release/* \
            --repo diad87/pletina-releases \
            --title "Pletina ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
