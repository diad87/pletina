[package]
name = "musify"
version = "0.2.1"
description = "Reproductor de música personal"
edition = "2024"
rust-version = "1.90"

[lib]
name = "musify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["gzip"] }
tokio = { version = "1", features = ["macros", "process", "sync", "time", "io-util"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"

# Binario pequeño: la ligereza es prioridad.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
