[package]
name = "musify"
version = "0.9.1"
description = "Pletina: reproductor de música tipo Spotify"
license = "GPL-3.0-or-later"
repository = "https://github.com/diad87/pletina"
edition = "2024"
rust-version = "1.90"

[lib]
name = "musify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
roxmltree = "0.21"
encoding_rs = "0.8"
# rustls en todas partes: el TLS del sistema obligaría a compilar OpenSSL para Android.
reqwest = { version = "0.12", default-features = false, features = ["gzip", "rustls-tls", "charset", "http2"] }
tokio = { version = "1", features = ["macros", "process", "sync", "time", "io-util"] }
# Pure JavaScript only: no module loader, host I/O, async bindings or custom allocator.
rquickjs = { version = "0.14.0", default-features = false, features = ["std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
lofty = "0.25.4"
base64 = "0.22"
sha2 = "0.10"
minisign-verify = "0.2"

# Solo en escritorio: una sola instancia y el actualizador de Tauri (en Android, Obtainium).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# Android: el servicio de música llama al núcleo Rust por JNI (ver android.rs).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# Android has no pre-generated rquickjs bindings; use the NDK toolchain headers.
rquickjs = { version = "0.14.0", default-features = false, features = ["std", "bindgen"] }

# Canal nativo con la ventana oculta del reproductor oficial (motor propio).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

# Binario pequeño: la ligereza es prioridad.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# QuickJS's interpreter uses much more C stack without optimization. Keep the
# same 512 KiB execution limit in development instead of relaxing the sandbox.
[profile.dev.package.rquickjs-sys]
opt-level = 2

# Keep the bounded interpreter fast in release too. Size-oriented C builds add
# about 1.2 s to the real cold-player fixture; the rest of the app stays at "s".
[profile.release.package.rquickjs-sys]
opt-level = 2

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

# Exact upstream crate with the documented Windows clang-cl dispatch/build patch.
[patch.crates-io]
rquickjs-sys = { path = "vendor/rquickjs-sys" }
